name: Waypoint
options:
  bundleIdPrefix: com.danielguzman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Waypoint
        excludes:
          - Info.plist
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint
        CODE_SIGN_ENTITLEMENTS: Waypoint/Waypoint.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9AGJR7SC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Waypoint/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WaypointWidgetsExtension
        embed: true
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  WaypointWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointWidgets
        excludes:
          - Info.plist
      # Shared with the main app target so the extension can encode/decode the same Live
      # Activity attributes and read the same App Group snapshot the app writes — not
      # duplicated on disk, just compiled into both targets.
      - path: Waypoint/Models/NavigationActivityAttributes.swift
      - path: Waypoint/Services/NavigationWidgetDataStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint.widgets
        CODE_SIGN_ENTITLEMENTS: WaypointWidgets/WaypointWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9AGJR7SC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WaypointWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Waypoint

  WaypointUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waypoint
    dependencies:
      - target: Waypoint

schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
        WaypointUITests: [test]
    test:
      targets:
        - WaypointTests
        - WaypointUITests
    run:
      config: Debug
    archive:
      config: Release
