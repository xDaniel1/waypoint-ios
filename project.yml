name: Waypoint
options:
  bundleIdPrefix: com.danielguzman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Waypoint
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Waypoint uses your location to center the map and show places near you."
        INFOPLIST_KEY_GOOGLE_PLACES_API_KEY: "$(GOOGLE_PLACES_API_KEY)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Waypoint

schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
    test:
      targets:
        - WaypointTests
    run:
      config: Debug
    archive:
      config: Release
