name: Waypoint
options:
  bundleIdPrefix: com.danielguzman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Waypoint
        excludes:
          - Info.plist
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint
        CODE_SIGN_ENTITLEMENTS: Waypoint/Waypoint.entitlements
        # CarPlay's entitlement (com.apple.developer.carplay-maps) is one Apple grants by
        # application, not something a paid account just has. Until that request is approved,
        # a device build carrying the key fails to sign at all ("Entitlement ... not found and
        # could not be included in profile"), which would block installing the app on a phone
        # entirely. The simulator doesn't validate provisioning, so the CarPlay build stays
        # testable there. When Apple approves it, delete this override and put the key in the
        # main entitlements file.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Waypoint/WaypointCarPlay.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9AGJR7SC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Waypoint/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WaypointWidgetsExtension
        embed: true

  WaypointWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointWidgets
        excludes:
          - Info.plist
      # Shared with the main app target so the extension can encode/decode the same Live
      # Activity attributes and read the same App Group snapshot the app writes — not
      # duplicated on disk, just compiled into both targets.
      - path: Waypoint/Models/NavigationActivityAttributes.swift
      - path: Waypoint/Services/NavigationWidgetDataStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint.widgets
        CODE_SIGN_ENTITLEMENTS: WaypointWidgets/WaypointWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9AGJR7SC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WaypointWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Waypoint

  WaypointUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waypoint
    dependencies:
      - target: Waypoint

schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
        WaypointUITests: [test]
    test:
      targets:
        - WaypointTests
        - WaypointUITests
    run:
      config: Debug
    archive:
      config: Release
