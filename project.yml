name: Waypoint
options:
  bundleIdPrefix: com.danielguzman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Waypoint
        excludes:
          - Info.plist
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielguzman.waypoint
        CODE_SIGN_ENTITLEMENTS: Waypoint/Waypoint.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9AGJR7SC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Waypoint/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Waypoint

  WaypointUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WaypointUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waypoint
    dependencies:
      - target: Waypoint

schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
        WaypointUITests: [test]
    test:
      targets:
        - WaypointTests
        - WaypointUITests
    run:
      config: Debug
    archive:
      config: Release
